name: Validación

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  backend-tests:
    name: Backend Tests

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Descargando repositorio
        uses: actions/checkout@v4

      - name: Configurando Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: 20
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Instalando dependencias npm
        run: npm ci

      - name: Ejecutando pruebas
        run: npm test