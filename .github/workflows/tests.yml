name: Validación

on:
  push:
    branches:
      - feature/github-actions-Tests

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mostrar información del entorno
        run: |
          node --version
          npm --version
          pwd
          ls -la
